name: clockwork
on:
  schedule:
    - cron: "3,18,33,48 * * * *"   # the backup clock; the primary is cron-job.org hitting workflow_dispatch
  workflow_dispatch:
    inputs:
      job: { description: "press | dry | doctor | claimcheck | holders | tgcheck", default: press, type: choice, options: [press, dry, doctor, claimcheck, holders, tgcheck] }
permissions: { contents: write }
concurrency: { group: clockwork, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      # an exact version, never @latest: the machine key is in this step's environment, so the code that
      # runs here is only ever a build we published with provenance and you chose by hand. to update,
      # change the number (docs/PUBLISH.md in the clockwork repo lists releases).
      - run: npx --yes clockwork-press@0.2.0 ${{ inputs.job || 'press' }}
        env:
          npm_config_ignore_scripts: "true"   # no package lifecycle scripts run on install; only the clockwork bin runs
          MACHINE_WALLET_KEY: ${{ secrets.MACHINE_WALLET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # only for telegram mode "own"; leave the secret unset in shared mode
      # always: what a failed run wrote before it failed (a claim row, the legs of a slice, lastRunAt) is the
      # truth, and the next tick's interval guard reads it from this commit.
      - name: commit the numbers
        if: always()
        run: |
          git config user.name "clockwork"; git config user.email "clockwork@users.noreply.github.com"
          git add data/ && (git diff --cached --quiet || (git commit -qm "clockwork: update" && git pull -q --rebase origin main && git push -q origin main))
